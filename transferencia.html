<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Transferencia exitosa · Chronos &amp; Papyrus</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
body{margin:0;background:#F0EDE5;color:#1B2A24;font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 16px}
h1{margin:0 0 16px;font-size:26px;color:#0D4A3A}
.t{background:#fff;border:1px solid #DAD5C8;border-radius:10px;padding:16px 18px}
dl{margin:0}dt{font-size:15px;color:#4F5B55;margin-top:10px}dt:first-child{margin-top:0}dd{margin:0;font-size:24px;font-weight:700}
p{color:#4F5B55;font-size:16px}
</style></head><body>
<main id="main"><h1 id="h">Transferencia exitosa</h1>
<div class="t" id="d"></div>
<p id="n"></p></main>
<script>
(function(){var q=new URLSearchParams(location.search),m=q.get("m")||"",c=q.get("c")||"",d=document.getElementById("d"),n=document.getElementById("n");
function tx(t){var e=document.createElement("div");e.textContent=t;return e.innerHTML}
if(/^\d{1,6}(\.\d{2})$/.test(m)&&/^\d{6,15}$/.test(c)){
d.innerHTML='<dl><dt>Monto a pagar</dt><dd>$'+tx(m)+'</dd><dt>Código de comprobante</dt><dd>'+tx(c)+'</dd><dt>Para</dt><dd style="font-size:18px">Chronos &amp; Papyrus · Banco Pichincha</dd></dl>';
n.textContent="Escribe este código de comprobante en la tienda para confirmar tu pedido.";
}else{document.title="Datos no válidos · Chronos & Papyrus";document.getElementById("h").textContent="Datos no válidos";d.textContent="Este código QR no tiene datos de transferencia. Vuelve a la tienda y genera el QR otra vez."}
})();
</script></body></html>
